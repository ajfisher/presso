<section data-rehearsal-microphone hidden>
  <label>Microphone <select data-microphone-input><option value="">System default</option></select></label>
  <label>Input level <meter data-microphone-level min="0" max="1" value="0"></meter></label>
  <p data-microphone-status role="status"></p>
  <button type="button" data-microphone-check>Check microphone</button>
  <button type="button" data-microphone-start disabled>Start recording</button>
  <section data-transcript-preparation aria-label="Transcription">
    <p>Prepare English transcription for offline use. The first download is about 110 MB.</p>
    <button type="button">Prepare transcription</button>
    <p role="status"></p>
  </section>
</section>
