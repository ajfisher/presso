<div role="group" aria-label="Rehearsal" data-control-row="rehearsal">
  <button type="button" data-rehearsal-toggle disabled>Start timing</button>
  <button type="button" data-rehearsal-open disabled>Rehearsals</button>
  <time data-rehearsal-elapsed aria-label="Rehearsal elapsed time" hidden></time>
  <button type="button" data-rehearsal-reload hidden>Reload deck</button>
  <p data-rehearsal-status role="status"></p>
</div>
