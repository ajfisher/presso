name: Full-length rehearsal benchmark

on:
  push:
    branches: ['codex/rehearsal-engine-probe']

permissions:
  contents: read

concurrency:
  group: rehearsal-engine-probe
  cancel-in-progress: false

jobs:
  decode:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare the public MIT lecture fixture
        run: |
          curl --silent --show-error --fail --location --retry 2 --max-time 100 \
            https://archive.org/download/MIT6.006S20/MIT6_006S20_02_04_Lecture_1_300k.mp4 \
            --output "$RUNNER_TEMP/lecture.mp4"
          curl --silent --show-error --fail --location --retry 2 --max-time 30 \
            https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/dd0823c3851b5df3a7e0b447eaa76050_ZA-tUyM_y7s.vtt \
            --output "$RUNNER_TEMP/lecture.vtt"
          shasum -a 256 "$RUNNER_TEMP/lecture.mp4" "$RUNNER_TEMP/lecture.vtt"
          command -v ffmpeg >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          ffmpeg -hide_banner -loglevel error -threads 1 -i "$RUNNER_TEMP/lecture.mp4" \
            -map 0:a:0 -ac 1 -ar 16000 -c:a pcm_s16le -f s16le "$RUNNER_TEMP/lecture.pcm"
      - name: Transcribe uninterrupted and resume after closing Chrome
        env:
          DECK: examples/basic
          INPUT_PCM: ${{ runner.temp }}/lecture.pcm
          BENCHMARK_RESULT: ${{ runner.temp }}/benchmark.json
        run: |
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu hw.memsize
          sw_vers
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version
          python3 scripts/rehearsal-engine-guard.py --duration 2350 \
            --log "$RUNNER_TEMP/probe.log" -- node scripts/rehearsal-long-benchmark.mjs
      - name: Compare the saved word timings with MIT captions
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/benchmark.json"; then
            python3 scripts/measure-rehearsal-benchmark.py "$RUNNER_TEMP/benchmark.json" "$RUNNER_TEMP/lecture.vtt"
          fi
