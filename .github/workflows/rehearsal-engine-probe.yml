name: Rehearsal transcript and fitted timings probe

on:
  push:
    branches: ['codex/rehearsal-engine-probe']

permissions:
  contents: read

concurrency:
  group: rehearsal-engine-probe
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare an editable deck and the public reference clip
        run: |
          DECK="$RUNNER_TEMP/fit-fixture"
          INPUT_WAV="$RUNNER_TEMP/rehearsal-reference.wav"
          printf 'DECK=%s\nINPUT_WAV=%s\n' "$DECK" "$INPUT_WAV" >> "$GITHUB_ENV"
          curl --silent --show-error --fail --location --retry 2 --max-time 45 \
            https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav --output "$INPUT_WAV"
          mkdir -p "$DECK/slides"
          cat > "$DECK/presso.config.mjs" <<'DECK_CONFIG'
          export default {
            title: 'Timing and speech fixture',
            source: { type: 'folder', path: './slides' },
            notes: { public: false }
          };
          DECK_CONFIG
          for index in 1 2 3; do
            cat > "$DECK/slides/00$index.md" <<SLIDE
          ---
          id: slide-$index
          layout: statement
          ---

          # Slide $index

          :::notes
          Unpublished rehearsal fixture notes.
          :::
          SLIDE
          done
      - name: Resume real speech, apply fitted targets and re-export
        run: |
          python3 scripts/rehearsal-engine-guard.py --duration 330 \
            --log "$RUNNER_TEMP/probe.log" -- node scripts/rehearsal-engine-probe.mjs
      - name: Verify the rebuilt static deck keeps recorded speech and private notes out
        run: |
          node packages/server/dist/cli.js build "$DECK"
          python3 - <<'PY'
          import os
          from pathlib import Path
          output = Path(os.environ['DECK']) / 'dist'
          assert (output / 'transcript.md').is_file()
          assert sorted(p.name for p in (output / '_presso').iterdir()) == ['presso-runtime.js', 'presso.css']
          for artifact in output.rglob('*'):
              if artifact.suffix in {'.html', '.md', '.json'}:
                  content = artifact.read_text()
                  assert 'fellow Americans' not in content, artifact
                  assert 'Unpublished rehearsal fixture notes.' not in content, artifact
          print('PASS public export retained the static deck and excluded private rehearsal data')
          PY

  compare-apple-backends:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DECK: examples/basic
      COMPARE_BACKENDS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download the public reference clip
        run: |
          INPUT_WAV="$RUNNER_TEMP/rehearsal-reference.wav"
          printf 'INPUT_WAV=%s\n' "$INPUT_WAV" >> "$GITHUB_ENV"
          curl --silent --show-error --fail --location --retry 2 --max-time 45 \
            https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav --output "$INPUT_WAV"
      - name: Compare automatic WebGPU selection and CPU inference on Apple silicon
        run: |
          sysctl -n machdep.cpu.brand_string
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version
          python3 scripts/rehearsal-engine-guard.py --duration 350 \
            --log "$RUNNER_TEMP/backend-probe.log" -- node scripts/rehearsal-engine-probe.mjs
